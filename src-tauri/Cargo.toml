[package]
name = "chirper-app"
description = "Chirper Tauri application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false
build = "build.rs"

[lib]
name = "chirper_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Adds the in-process demo network and opens the database without a key (development only).
mock = []

[dependencies]
tauri = { version = "=2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-os = "=2.4.0"
log = "=0.4.35"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
zeroize = "=1.9.2"
chirper-bridge = { path = "../crates/chirper-bridge" }
chirper-net-sms = { path = "../crates/chirper-net-sms" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
getrandom = "=0.4.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "=2.4.2"
tauri-plugin-biometric = "=2.5.0"
tauri-plugin-chirper-native = { path = "../plugins/chirper-native" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSHapticFeedback"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext", "LAPublicDefines", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=6.3.0"

# One plain Rust crate: no C ABI, no dlopen, no static archive to fold in.
[dependencies.chirper-core]
path = "../crates/chirper-core"
default-features = false
features = ["sqlcipher"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }
