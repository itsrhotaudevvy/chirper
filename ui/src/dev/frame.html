<!doctype html>
<!-- Dev-only screenshot harness: /src/dev/frame.html?w=390&h=844&src=<same-origin path> -->
<html><body style="margin:0;background:#000">
<script type="module">
  const p = new URLSearchParams(location.search);
  // Only same-origin paths may be framed; anything else (other origins, protocol-relative, javascript:) falls back to '/'.
  const requested = p.get('src') ?? '/';
  const target = new URL(requested, location.origin);
  const safeSrc = target.origin === location.origin ? target.pathname + target.search + target.hash : '/';
  // Sizes are clamped to plain positive integers so the style attribute cannot be influenced by the query string.
  const size = (raw, fallback) => {
    const n = Number.parseInt(raw ?? '', 10);
    return Number.isFinite(n) && n > 0 && n <= 10000 ? n : fallback;
  };
  const f = document.createElement('iframe');
  f.style.border = '0';
  f.style.display = 'block';
  f.style.width = `${size(p.get('w'), 390)}px`;
  f.style.height = `${size(p.get('h'), 844)}px`;
  f.src = safeSrc;
  document.body.appendChild(f);
</script>
</body></html>
