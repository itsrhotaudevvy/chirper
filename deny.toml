# cargo-deny configuration. Run with: cargo deny check
# Licence policy: every dependency must be compatible with distributing Chirper under AGPL-3.0.

[advisories]
version = 2
# Unmaintained-crate notices with no safe upgrade available yet. Accepted explicitly by the maintainer
# until the upstream dependencies move. Each is a maintenance notice, not a known vulnerability.
ignore = [
  # zbus 5 (zvariant, zbus_names, zvariant_derive) is still used by Tauri's notification, opener and
  # single-instance plugins and by the Linux keyring (keyring -> secret-service). The app's own code
  # uses zbus 6. Remove these when Tauri and secret-service move to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5 via zbus 5 in Tauri plugins and the Linux keyring; no safe upgrade yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 via zbus 5 in Tauri plugins and the Linux keyring; no safe upgrade yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 via zbus 5 in Tauri plugins and the Linux keyring; no safe upgrade yet" },
  # proc-macro-error is a build-time dependency of Tauri's GTK bindings (Linux only).
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri's GTK bindings; build-time only, no safe upgrade yet" },
  # rsa: Marvin timing side channel in RSA decryption (no fixed release). Only Discord's QR login
  # decrypts, with a fresh key per login and a handful of server-chosen ciphertexts, so an
  # attacker cannot collect the many timed decryptions the attack needs.
  { id = "RUSTSEC-2023-0071", reason = "per-login ephemeral key, a few decryptions; see comment" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not version-pinned; they are part of this repo.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
