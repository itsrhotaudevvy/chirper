# cargo-deny configuration. Run with: cargo deny check
# Licence policy: every dependency must be compatible with distributing Chirper under AGPL-3.0.

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not version-pinned; they are part of this repo.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
