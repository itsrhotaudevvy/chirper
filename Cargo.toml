[workspace]
resolver = "3"
members = [
    "crates/chirper-bridge",
    "crates/chirper-core",
    "crates/chirper-net-testnet",
    "crates/chirper-net-discord",
    "crates/chirper-net-fluxer",
    "crates/chirper-net-telegram",
    "crates/chirper-net-whatsapp",
    "crates/chirper-net-sms",
    "crates/chirper-net-signal",
    "crates/chirper-net-meta",
    "crates/chirper-net-twitter",
    "crates/chirper-net-linkedin",
    "crates/chirper-net-gmessages",
    "crates/chirper-net-gvoice",
    "crates/chirper-net-slack",
    "crates/chirper-net-bluesky",
    "crates/chirper-signal-protocol",
    "plugins/chirper-native",
    "src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
