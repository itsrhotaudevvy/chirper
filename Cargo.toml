[workspace]
resolver = "3"
members = ["crates/chirper-core", "plugins/chirper-native", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
