# Discord connector configuration.

# Create a portal for every guild channel the account can view as soon as the
# account syncs, up to this many channels per server.
# Channels above the limit are created lazily, on their first message.
sync_channel_limit: 1000

# Render Discord custom emoji reactions in Matrix (as ":name:" keys).
custom_emoji_reactions: true

backfill:
    # Fetch older history from Discord when a room is opened.
    enabled: true
    # Number of messages requested per backfill page (Discord allows at most 100).
    max_batch_count: 50
