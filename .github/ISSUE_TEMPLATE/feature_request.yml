name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Messaging UI
        - Accounts and login
        - A network connector
        - Platform integration
        - Privacy and security
        - Build, CI or docs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Chirper has no server and no telemetry. Features must keep it that way.
      options:
        - label: This feature does not send data anywhere except to the networks the user logs in to.
          required: true
