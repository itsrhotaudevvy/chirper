[package]
name = "chirper-net-slack"
description = "Slack driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
async-trait = "=0.1.92"
futures-util = "=0.3.34"
log = "=0.4.35"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
