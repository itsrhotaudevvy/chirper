[package]
name = "chirper-net-telegram"
description = "Telegram driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
aes = "=0.9.2"
async-trait = "=0.1.92"
base64 = "=0.23.1"
ctr = "=0.10.1"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
log = "=0.4.35"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
num-bigint = "=0.4.8"
pbkdf2 = "=0.12.2"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time"] }
