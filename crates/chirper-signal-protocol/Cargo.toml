[package]
name = "chirper-signal-protocol"
description = "Chirper's own Signal protocol: X3DH/PQXDH, the Double Ratchet, sender keys and sealed sender"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
aes = "=0.9.2"
aes-gcm = "=0.11.1"
cbc = "=0.2.1"
ctr = "=0.10.1"
curve25519-dalek = { version = "=4.1.3", features = ["digest"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["kyber", "mlkem1024"] }
prost = { version = "=0.14.4", features = ["derive"] }
rand = "=0.8.8"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.9.2", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "=0.4.3"
