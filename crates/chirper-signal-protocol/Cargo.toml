[package]
name = "chirper-signal-protocol"
description = "Chirper's own Signal protocol: X3DH/PQXDH, the Double Ratchet, sender keys and sealed sender"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
# The partial port in src/ (see src/lib.wip.rs) needs these once it is compiled again:
# curve25519-dalek = "=4.1.3"
# hkdf = "=0.12.4"
# hmac = "=0.12.1"
# prost = { version = "=0.14.4", features = ["derive"] }
# rand = "=0.8.8"
# sha2 = "=0.10.9"
# subtle = "=2.6.1"
# zeroize = { version = "=1.9.2", features = ["zeroize_derive"] }
# log = "=0.4.35"
