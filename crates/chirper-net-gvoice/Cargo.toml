[package]
name = "chirper-net-gvoice"
description = "Google Voice driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
async-trait = "=0.1.92"
base64 = "=0.23.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
log = "=0.4.35"
prost = "=0.14.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde_json = "=1.0.154"
sha1 = "=0.10.6"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
