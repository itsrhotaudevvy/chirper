[package]
name = "chirper-net-testnet"
description = "In-process demo network: end-to-end tests, UI development and wasm builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
async-trait = "=0.1.92"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros"] }
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
