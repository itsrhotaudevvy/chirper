[package]
name = "chirper-net-gmessages"
description = "Google Messages driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
aes = "=0.9.2"
aes-gcm = "=0.11.1"
async-trait = "=0.1.92"
base64 = "=0.23.1"
ctr = "=0.10.1"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
log = "=0.4.35"
prost = "=0.14.4"
futures-util = "=0.3.31"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
hex = "=0.4.3"
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
