[package]
name = "chirper-net-twitter"
description = "X (Twitter) driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
async-trait = "=0.1.92"
base64 = "=0.23.1"
log = "=0.4.35"
md-5 = "=0.10.6"
percent-encoding = "=2.3.2"
rand = "=0.8.8"
regex = "=1.13.1"
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
