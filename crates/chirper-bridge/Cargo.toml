[package]
name = "chirper-bridge"
description = "Chirper's unified, Matrix-free bridge runtime: one framework for every network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []

[dependencies]
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
sha2 = "=0.10.9"
hex = "=0.4.3"
getrandom = "=0.4.3"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "sync", "time", "macros"] }
zeroize = { version = "=1.9.2", features = ["derive"] }
log = "=0.4.35"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
