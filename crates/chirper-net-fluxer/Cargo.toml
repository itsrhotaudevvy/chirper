[package]
name = "chirper-net-fluxer"
description = "Fluxer driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
async-trait = "=0.1.92"
base64 = "=0.23.1"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hex = "=0.4.3"
log = "=0.4.35"
pbkdf2 = "=0.12.2"
percent-encoding = "=2.3.2"
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "=2.5.9"
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time"] }
