[package]
name = "chirper-net-signal"
description = "Signal driver for Chirper's unified bridge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[dependencies]
chirper-bridge = { path = "../chirper-bridge" }
chirper-signal-protocol = { path = "../chirper-signal-protocol" }
aes = "=0.9.2"
async-trait = "=0.1.92"
base64 = "=0.23.1"
cbc = "=0.2.1"
ctr = "=0.10.1"
futures-util = "=0.3.31"
hex = "=0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
log = "=0.4.35"
prost = { version = "=0.14.4", features = ["derive"] }
rand = "=0.8.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "multipart"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "=1.16.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "=2.5.8"
zeroize = { version = "=1.9.2", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
